# https://github.com/mattn/go-sqlite3#dsn-examples
database: "file:store.db"
# How long forwarded posts stay editable via Discord (edits to older
# posts are skipped, and database records older than this are cleaned).
# Duration string, "24h" by default; "0" disables cleanup entirely.
retention: "24h"
# Per-file upload limit in MiB. Files larger than this are not forwarded;
# instead the bot asks in the Telegram channel, as a reply to the post,
# whether to forward the rest of the post (its text) without them.
# 20 by default (Discord's default per-file limit).
max_file_size_mb: 20
telegram:
  token: ""
  debug: true
discord:
  token: ""
  channel_id: ""
